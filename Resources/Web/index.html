<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SparkNetLoger · Live Logs</title><link rel="icon" type="image/png" href="/web_logo.png"><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><header><div><img class="brand" src="/web_logo.png" alt="" width="48" height="48"><h1>SparkNetLoger <small data-i18n="live">Live Logs</small></h1></div><span id="status" role="status">Connecting…</span></header>
<main><section class="toolbar"><div class="toolbar-heading"><button id="toggle-filters" aria-expanded="true" aria-controls="filters">Collapse filters</button><div class="actions"><select id="language" aria-label="Language"><option value="en">English</option><option value="zh">中文</option></select><button id="scroll" aria-pressed="true">Auto-scroll: On</button><button id="scroll-bottom" data-i18n="bottom" type="button" aria-controls="log-viewport">Scroll to bottom</button><button id="toggle-raw" type="button" aria-pressed="false">Switch to plain text</button><button id="copy-logs" data-i18n="copy" type="button" hidden>Copy all</button><span id="copy-status" role="status"></span><button id="clear" data-i18n="clear" type="button">Clear logs</button></div></div><div id="filters"><label class="search"><span data-i18n="search">Search logs</span><input id="search" type="search" placeholder="Search message, tag, source location or context" autocomplete="off"></label><fieldset id="levels"><legend data-i18n="levels">Log levels</legend></fieldset><fieldset id="tags"><legend>Tags</legend></fieldset></div></section>
<div class="summary"><span id="count">0 logs</span><span id="view-hint">Latest 2000 logs · Click a log to expand context</span></div><section id="log-viewport" aria-label="Log list" tabindex="0"><div id="logs"></div><p id="empty">Waiting for logs from the app</p></section><textarea id="raw-logs" readonly hidden aria-label="Plain-text logs" spellcheck="false" placeholder="Waiting for logs from the app"></textarea></main></body></html>
